# OpenIDEA 运行配置（随项目共享）。
# "BackendApplication (前端托管)"：启动前先执行前端打包，再启动后端并直接托管 frontend/dist。
# OpenIDEA 的 Java 启动走 jdtls 编译，不执行 Maven 生命周期，pom 中的 npm 打包和静态资源拷贝不会触发，
# 因此这里用启动前任务打包，并通过 static-locations 让后端优先读取 frontend/dist（classpath:/static/ 作为兜底）。

[[configurations]]
id = "user:frontend-build"
name = "前端打包 (npm run build)"
kind = "shell"
command = "npm.cmd"
args = ["run", "build"]
cwd = "frontend"
folder = "Knowledge"

[[configurations]]
id = "user:backend-with-frontend"
name = "BackendApplication (前端托管)"
kind = "spring-boot"
command = "java"
args = [
  "-cp",
  "${classpath}",
  "com.example.backend.BackendApplication",
  "--spring.web.resources.static-locations=file:../frontend/dist/,classpath:/static/",
]
cwd = "backend"
module = "backend"
debug-adapter = "java-debug"
folder = "Knowledge"
before-launch = [{ kind = "run", target = "user:frontend-build" }]
params = { mainClass = "com.example.backend.BackendApplication", classpath = "${classpath}", programArgs = "--spring.web.resources.static-locations=file:../frontend/dist/,classpath:/static/" }

[[configurations]]
id = "user:android-emulator"
name = "Android: 前端打包并运行 WebView (API 34)"
kind = "shell"
command = "powershell.exe"
args = ["-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "run-android.ps1"]
cwd = "Android"
folder = "Android"
