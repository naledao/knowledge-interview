spring:
  # 从项目 .env 文件加载配置，兼容在仓库根目录或 backend 目录启动
  config:
    import:
      - "optional:file:./.env[.properties]"
      - "optional:file:./backend/.env[.properties]"
  # 启动时自动执行尚未应用的数据库版本迁移
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration}
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    validate-on-migrate: ${FLYWAY_VALIDATE_ON_MIGRATE:true}
  application:
    name: ${APP_NAME:backend}
  # MySQL 数据源配置；连接参数优先从环境变量读取
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/knowledge_interview?serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD}
    driver-class-name: ${MYSQL_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
    # HikariCP 连接池配置，适用于个人 MCP 服务
    hikari:
      pool-name: ${HIKARI_POOL_NAME:KnowledgeHikariPool}
      maximum-pool-size: ${HIKARI_MAXIMUM_POOL_SIZE:5}
      minimum-idle: ${HIKARI_MINIMUM_IDLE:1}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:30000}
      validation-timeout: ${HIKARI_VALIDATION_TIMEOUT:5000}
      idle-timeout: ${HIKARI_IDLE_TIMEOUT:600000}
      max-lifetime: ${HIKARI_MAX_LIFETIME:1800000}

  ai:
    mcp:
      server:
        name: ${MCP_SERVER_NAME:knowledge-mcp}
        version: ${MCP_SERVER_VERSION:1.0.0}
        protocol: ${MCP_SERVER_PROTOCOL:STREAMABLE}
        type: ${MCP_SERVER_TYPE:SYNC}
        capabilities:
          tool: ${MCP_TOOL_ENABLED:true}
          resource: ${MCP_RESOURCE_ENABLED:false}
          prompt: ${MCP_PROMPT_ENABLED:false}
          completion: ${MCP_COMPLETION_ENABLED:false}

mcp:
  auth:
    api-key: ${MCP_API_KEY}
