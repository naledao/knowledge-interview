spring:
  # 从项目 .env 文件加载配置，兼容在仓库根目录或 backend 目录启动
  config:
    import:
      - "optional:file:../.env[.properties]"
      - "optional:file:./.env[.properties]"
      - "optional:file:./backend/.env[.properties]"
  # 启动时自动执行尚未应用的数据库版本迁移
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration}
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    validate-on-migrate: ${FLYWAY_VALIDATE_ON_MIGRATE:true}
  application:
    name: ${APP_NAME:backend}
  # MySQL 数据源配置；连接参数优先从环境变量读取
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/knowledge_interview?serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD}
    driver-class-name: ${MYSQL_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
    # HikariCP 连接池配置，适用于个人 MCP 服务
    hikari:
      pool-name: ${HIKARI_POOL_NAME:KnowledgeHikariPool}
      maximum-pool-size: ${HIKARI_MAXIMUM_POOL_SIZE:5}
      minimum-idle: ${HIKARI_MINIMUM_IDLE:1}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:30000}
      validation-timeout: ${HIKARI_VALIDATION_TIMEOUT:5000}
      idle-timeout: ${HIKARI_IDLE_TIMEOUT:600000}
      max-lifetime: ${HIKARI_MAX_LIFETIME:1800000}

  ai:
    mcp:
      server:
        name: ${MCP_SERVER_NAME:knowledge-mcp}
        version: ${MCP_SERVER_VERSION:1.0.0}
        # 默认使用无状态 Streamable HTTP（GET /mcp 返回 405，避免阻塞等待空闲 SSE 响应头）
        protocol: ${MCP_SERVER_PROTOCOL:STATELESS}
        type: ${MCP_SERVER_TYPE:SYNC}
        instructions: >-
          本知识库采用分类(Category)→主题(Topic)→问题(Question，可附答案)三级结构；分类仅表示领域，主题组织知识点，具体问答必须存入 Question。
          整理前请获取 organize_knowledge 提示词，先查询并复用已有分类和主题，避免重复创建。
          创建或更新问题的非空 answerText 必须是完整的浅色主题 HTML 文档，包含 DOCTYPE、html/head/body、内联 CSS 和移动端 viewport；按需使用内联 JavaScript，不使用 Markdown 代码围栏或外部资源。
          MCP 写入工具会校验新提交的答案格式，不符合要求时请根据错误信息修正后重试；已有答案不强制转换。
          AI Agent 负责知识提取与组织；本 MCP 仅负责校验和 CRUD。
        capabilities:
          tool: ${MCP_TOOL_ENABLED:true}
          resource: ${MCP_RESOURCE_ENABLED:false}
          prompt: ${MCP_PROMPT_ENABLED:true}
          completion: ${MCP_COMPLETION_ENABLED:false}

mcp:
  auth:
    api-key: ${MCP_API_KEY}

# 私有 GitHub Release 只允许后端持有只读访问令牌。
app:
  update:
    github-token: ${GITHUB_RELEASE_TOKEN:}
