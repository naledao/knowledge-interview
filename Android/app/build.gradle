plugins {
    id 'com.android.application'
}

android {
    namespace 'com.knowledgeinterview.android'
    compileSdk 34

    defaultConfig {
        applicationId 'com.knowledgeinterview.android'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// OpenIDEA Android Java source compatibility
// Expose Android Java sources and SDK to the Gradle Java model.
sourceSets {
    main {
        java.srcDir 'src/main/java'
        compileClasspath += files(android.bootClasspath)
    }
}

// OpenIDEA Buildship Android dependencies
// Resolve SDK jar from SDK directory instead of android.bootClasspath,
// which may be empty during early Gradle model evaluation.
apply plugin: 'eclipse'

configurations {
    openideaAndroidClasspath
}

dependencies {
    openideaAndroidClasspath files(file("${android.sdkDirectory}/platforms/${android.compileSdkVersion}/android.jar"))
    openideaAndroidClasspath files(file("${project.buildDir}/intermediates/compile_and_runtime_not_namespaced_r_class_jar/debug/processDebugResources/R.jar"))
}

eclipse {
    classpath {
        plusConfigurations += [configurations.openideaAndroidClasspath]
    }
}
