name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: knowledge-interview-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: 安装 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 现有 pom.xml 在 generate-resources 阶段调用 Windows 专用 npm.cmd，
      # Linux CI 使用 -Dexec.skip=true 跳过该步骤，显式控制构建顺序。
      - name: 先打包后端
        run: mvn -B -ntp -f backend/pom.xml -Dexec.skip=true -DskipTests package

      - name: 打包前端
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # 第二次打包通过 pom.xml 中的 maven-resources-plugin，
      # 将 frontend/dist 拷贝到 BOOT-INF/classes/static，统一由后端托管。
      - name: 将前端资源打入后端 JAR
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f backend/pom.xml -Dexec.skip=true -DskipTests package
          jar_file="$(find backend/target -maxdepth 1 -type f -name 'backend-*.jar' ! -name '*.original' | head -n 1)"
          test -n "$jar_file"
          unzip -Z1 "$jar_file" | grep -x 'BOOT-INF/classes/static/index.html' > /dev/null
          cp "$jar_file" "$RUNNER_TEMP/app.jar"

      - name: 通过 SSH 部署并启动
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          REPO_NAME: ${{ github.event.repository.name }}
          DEPLOY_APP_PORT: ${{ vars.DEPLOY_APP_PORT }}
        run: |
          set -euo pipefail
          for variable in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            if [[ -z "${!variable}" ]]; then
              echo "缺少 GitHub Actions Secret: ${variable}" >&2
              exit 1
            fi
          done
          if [[ "$DEPLOY_USER" != root ]]; then
            echo "当前 /root/service 部署方案需要 DEPLOY_USER=root" >&2
            exit 1
          fi
          port="${DEPLOY_PORT:-22}"
          key="$RUNNER_TEMP/deploy_key"
          known_hosts="$RUNNER_TEMP/known_hosts"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$known_hosts"
          chmod 600 "$key" "$known_hosts"

          ssh_options=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts" -o ConnectTimeout=15)
          remote="${DEPLOY_USER}@${DEPLOY_HOST}"
          target="/root/service/${REPO_NAME}"
          ssh "${ssh_options[@]}" -p "$port" "$remote" "mkdir -p '$target'"
          scp "${ssh_options[@]}" -P "$port" "$RUNNER_TEMP/app.jar" "$remote:$target/app.jar.next"
          ssh "${ssh_options[@]}" -p "$port" "$remote" "bash -s -- '$REPO_NAME' '${DEPLOY_APP_PORT:-8080}'" < .github/scripts/deploy-remote.sh
